<html>
<head>
    <title>RPG</title>
    <script src=https://code.jquery.com/jquery-3.6.0.min.js></script>
    <link href="/css/my.css" rel="stylesheet">
</head>
<body onload="list()">
<h1>RPG admin panel</h1>
<h2>Accounts list:</h2>

<label for="count_1">Count per page</label>
<select id="count_1" onchange="list()">
    <option value="3">3</option>
    <option value="3">5</option>
    <option value="3">10</option>
    <option value="3">20</option>
</select>

<table id="table">
<!--    <thead>-->
        <tr>
            <th>#</th>
            <th>Name</th>
            <th>Title</th>
            <th>Race</th>
            <th>Profession</th>
            <th>Level</th>
            <th>Birthday</th>
            <th>Banned</th>
        </tr>
<!--    </thead>-->
</table>

<div id="paging_buttons">Pages:</div>

<script>
    function list() {
        $('tr:has(td)').remove();

        let url = "/rest/players";
        $.get(url, function (response) {
            $.each(response, function (i, item) {
                $('<tr>').html('<td>'
                    + item.id + "</td><td>"
                    + item.name + "</td><td>"
                    + item.title + "</td><td>"
                    + item.race + "</td><td>"
                    + item.profession + "</td><td>"
                    + item.level + "</td><td>"
                    + new Date(item.birthday).toLocaleDateString() + "</td><td>"
                    + item.banned + "</td>"
                ).appendTo("#table")
            })
        })

        let totalCount = getTotalCount();
        let countPerPage = $("count_1").val();

        if (countPerPage == null) {
            countPerPage = 3;
        }

        let pagesCount = Math.ceil(totalCount / countPerPage);

        $('button.pgn-bnt-styled').remove();

        for (let i = 0; i < pagesCount; i++) {
            let button_tag = "<button>" + (i + 1) + "</button>"
            let btn = $(button_tag)
                .attr('id', 'paging_button_' + 1)
                .attr('onclick', 'list()')
                .addClass('pgn-bnt-styled');   <!-- # qavs ichidagi remove dagi blan 1 xil bumasa ishlamaydi -->
            $('#paging_buttons').append(btn);   <!-- # qopketsayam 14 knopkaa kurinmaydi -->
        }

    }

    function getTotalCount() {
        let url = "/rest/players/count"
        let res = 0;
        $.ajax({
            url: url,
            async: false,        <!-- xato ketsa saytda hech narsa kurinmaydi -->
            success: function (result) {
                res = parseInt(result);
            }
        })

        return res;
    }

</script>
